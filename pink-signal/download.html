<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>두근두근 다운로드</title>
    <script>
      const ua = navigator.userAgent || navigator.vendor || "";
      const iosUrl = "https://apps.apple.com/app/id6767147867";
      const androidUrl = "https://play.google.com/store/apps/details?id=com.dreamy2g.pinksignal";
      const isAndroid = /android/i.test(ua);
      const isIos = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      window.location.replace(isAndroid ? androidUrl : isIos ? iosUrl : iosUrl);
    </script>
  </head>
  <body>
    <noscript>
      <p>두근두근 다운로드</p>
      <p><a href="https://apps.apple.com/app/id6767147867">App Store</a></p>
      <p><a href="https://play.google.com/store/apps/details?id=com.dreamy2g.pinksignal">Google Play</a></p>
    </noscript>
  </body>
</html>
